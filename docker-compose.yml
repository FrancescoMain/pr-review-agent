# Local development services for the PR Review Agent.
#
# Postgres holds run history and cost tracking (SPEC §7); Qdrant holds the
# per-repo memory of project conventions (SPEC §4). Neither is consumed by
# the application code yet — they are stood up here so Week 2 / Week 3 can
# wire them in without an infrastructure step. Volumes are bind-mounted so
# `ls postgres_data/ qdrant_data/` shows you exactly what is on disk.

services:
  postgres:
    image: postgres:17-alpine
    container_name: pr-review-postgres
    # Host port 5433 because 5432 is commonly held by other local Postgres
    # instances on this machine (see jassie / pinkcare projects). The
    # in-container port stays 5432 — only DATABASE_URL on the host changes.
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_review_agent
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pr_review_agent"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: pr-review-qdrant
    ports:
      - "6333:6333"   # HTTP / REST
      - "6334:6334"   # gRPC
    volumes:
      - ./qdrant_data:/qdrant/storage
    # The qdrant image ships without wget/curl/nc, so we probe via
    # bash's /dev/tcp pseudo-device. Successful TCP open on 6333 is
    # close enough to "ready" for our purposes; the Bruno smoke tests
    # the actual /collections endpoint anyway.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/6333"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
