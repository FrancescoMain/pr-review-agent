[project]
name = "pr-review-agent"
version = "0.1.0"
description = "LangGraph agent that performs structured code review on GitHub Pull Requests."
readme = "README.md"
authors = [
    { name = "Francesco Cesarano", email = "cesaranofrancescomain@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.4.3",
    "langchain-core>=1.3.2",
    "langgraph>=1.1.10",
    "pydantic-settings>=2.14.0",
    "pyjwt[crypto]>=2.12.1",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.17.1",
    "sentence-transformers>=5.4.1",
    "structlog>=25.5.0",
    "types-pyyaml>=6.0.12.20260408",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pyright>=1.1.390",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
